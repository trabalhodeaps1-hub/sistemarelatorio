# Produção: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
name: autorelatorio

x-app: &app
  build:
    context: .
    target: app
  image: autorelatorio-app:latest
  env_file: .env.production
  restart: unless-stopped
  volumes:
    - storage:/var/www/html/storage
  depends_on:
    postgres:
      condition: service_healthy

services:
  app:
    <<: *app
    environment:
      RUN_DEPLOY_TASKS: "1"

  # Agendador (os:verificar-atrasos de hora em hora) — equivale ao cron "* * * * * php artisan schedule:run"
  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]

  nginx:
    build:
      context: .
      target: web
    image: autorelatorio-web:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - certbot-www:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - app

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: America/Sao_Paulo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  storage:
  pgdata:
  certbot-www:
  certbot-certs:
